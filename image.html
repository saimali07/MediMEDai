<!DOCTYPE html>
<html lang="en" dir="ltr" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Photo Assessment — MediMind AI</title>
  <meta name="description" content="MediMind AI — educational, non-diagnostic health assessment from text, photos, voice and lab reports.">
  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,500;0,6..72,600;1,6..72,500&family=Noto+Naskh+Arabic:wght@400;500;600;700&family=Public+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <script src="js/theme-init.js"></script>
</head>
<body>
  <div id="site-header"></div>

  <main id="app-main">
    <section id="form-section">
      <div class="form-container">
        <div class="step-indicator"><span>Add visual reference</span><span class="field-badge-req">Photo Assessment</span></div>
        <div id="live-banner"></div>
        <div class="panel" style="margin-top:1rem;">
          <div class="dropzone" id="dropzone" tabindex="0" role="button" aria-label="Choose photos">
            <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="var(--primary)" stroke-width="1.8" style="margin-bottom:0.75rem;"><path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"></path><circle cx="12" cy="13" r="4"></circle></svg>
            <h4 style="font-size:1.125rem; font-weight:600; margin-bottom:0.25rem;">Drop photo here, or browse files</h4>
            <p style="font-size:0.875rem; color:var(--ink-soft);">Supports JPG, PNG and WebP up to 8 MB (up to 3 photos)</p>
            <p class="dropzone-tip">Tip: Ensure good direct light, keep camera focused on the border of the rash or cut, and include a clean reference object if helpful.</p>
          </div>
          <input type="file" id="file-input" accept="image/jpeg,image/png,image/webp" multiple class="hidden">
          <input type="file" id="camera-input" accept="image/*" capture="environment" class="hidden">
          <div class="btn-row"><button type="button" class="btn btn-secondary" id="camera-btn">Take a photo with camera</button></div>
          <div id="previews"></div>

          <div class="field-group" style="margin-top:1.5rem;">
            <label class="field-label" for="description"><span>Describe what you see and how it feels</span><span class="field-badge-req">Recommended</span></label>
            <textarea id="description" class="input-text" maxlength="2000" style="min-height:90px; resize:vertical;" placeholder="e.g. Red itchy patch on my left forearm for 3 days, spreading slowly"></textarea>
          </div>
          <div class="row-2">
            <div class="field-group"><label class="field-label" for="age">Age <span class="field-badge-req">Optional</span></label><input type="number" id="age" class="input-text" min="0" max="120"></div>
            <div class="field-group"><label class="field-label" for="sex">Sex <span class="field-badge-req">Optional</span></label>
              <select id="sex" class="input-select"><option value="">Prefer not to say</option><option value="female">Female</option><option value="male">Male</option><option value="other">Other</option></select></div>
          </div>
          <div class="consent-row" id="consent-row"><input type="checkbox" id="consent"><label for="consent">I consent to my photo being processed by an AI service to produce this educational assessment. See the <a href="privacy.html" target="_blank" rel="noopener">Privacy Policy</a>.</label></div>
          <p class="form-error" id="form-error" role="alert"></p>
          <div class="page-actions">
            <a class="btn btn-quiet" href="index.html">← Back</a>
            <button class="btn btn-primary" id="analyze-btn" disabled>Analyze Photo</button>
          </div>
        </div>
      </div>
    </section>
    <section id="analyzing" class="hidden"></section>
  </main>

  <div id="site-footer"></div>
  <div class="toast-container" id="toast-container" aria-live="polite"></div>
  <script type="module" src="js/pages/image.js"></script>
</body>
</html>
