<!DOCTYPE html>
<html lang="en" dir="ltr" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Create account — MediMind AI</title>
  <meta name="description" content="MediMind AI — educational, non-diagnostic health assessment from text, photos, voice and lab reports.">
  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,500;0,6..72,600;1,6..72,500&family=Noto+Naskh+Arabic:wght@400;500;600;700&family=Public+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <script src="js/theme-init.js"></script>
</head>
<body>
  <div id="site-header"></div>

  <main id="app-main">
    <div style="max-width:420px; margin:2rem auto;">
      <div class="panel">
        <h2 style="font-family:var(--font-display); font-size:1.75rem; margin-bottom:0.5rem; color:var(--ink);">Create your MediMind account</h2>
        <p style="color:var(--ink-soft); font-size:0.875rem; margin-bottom:1.5rem;">Save assessments, upload photos, voice notes and lab reports, and delete everything whenever you like.</p>
        <form id="auth-form" novalidate>
          <div class="field-group">
            <label class="field-label" for="auth-name">Name <span class="field-badge-req">Optional</span></label>
            <input type="text" id="auth-name" class="input-text" maxlength="80" autocomplete="name" placeholder="Your first name">
          </div>
          <div class="field-group">
            <label class="field-label" for="auth-email" data-i18n="auth_email">Email address</label>
            <input type="email" id="auth-email" class="input-text" required autocomplete="email" placeholder="you@domain.com">
          </div>
          <div class="field-group">
            <div class="field-label"><span data-i18n="auth_password">Password</span>
              <button type="button" id="toggle-pass" class="btn-quiet" style="padding:0; min-height:auto; font-size:0.8125rem; color:var(--primary); background:none; border:none; cursor:pointer;">Show</button></div>
            <input type="password" id="auth-pass" class="input-text" required minlength="8" autocomplete="new-password" placeholder="Use at least 8 characters">
          </div>
          <div class="consent-row" style="margin-top:0; margin-bottom:1.5rem;">
            <input type="checkbox" id="auth-consent" required>
            <label for="auth-consent">I understand MediMind AI provides educational guidance, not medical diagnoses, and I accept the <a href="terms.html">Terms</a> and <a href="privacy.html">Privacy Policy</a>.</label>
          </div>
          <button type="submit" id="auth-submit" class="btn btn-primary" style="width:100%;">Create account</button>
          <p class="form-error" id="auth-error" role="alert"></p>
        </form>
        <p style="text-align:center; font-size:0.8125rem; color:var(--ink-soft); margin-top:1rem;">
          Already have an account? <a href="login.html" style="color:var(--primary); font-weight:600;">Sign in</a>
        </p>
      </div>
    </div>
  </main>

  <div id="site-footer"></div>
  <div class="toast-container" id="toast-container" aria-live="polite"></div>
  <script type="module" src="js/pages/register.js"></script>
</body>
</html>
